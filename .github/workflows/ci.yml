name: Public setup bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify release allowlist and hashes
        run: python scripts/check_release_bundle.py
      - name: Verify unified execute request contract
        run: python scripts/check_execute_contract.py
      - name: Run setup tests
        run: python -m unittest discover -s keel-setup/tests -p 'test_*.py'
      - name: Run policy tests
        run: python -m unittest discover -s keel-policy/tests -p 'test_*.py'
      - name: Run shared tests
        working-directory: shared/scripts
        run: python -m unittest discover -s . -p 'test_*.py'
